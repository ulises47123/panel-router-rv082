<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8cff"/>
      <stop offset="1" stop-color="#1748c9"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- fondo -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#fondo)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="url(#brillo)"/>
  <!-- ondas de señal -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M86 92 A60 60 0 0 1 170 92" stroke-width="16"/>
    <path d="M106 114 A32 32 0 0 1 150 114" stroke-width="16"/>
  </g>
  <!-- antena -->
  <line x1="128" y1="134" x2="128" y2="154" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <!-- cuerpo del router -->
  <rect x="44" y="150" width="168" height="58" rx="18" fill="#ffffff"/>
  <!-- luces -->
  <circle cx="78" cy="179" r="9" fill="#1f6feb"/>
  <circle cx="106" cy="179" r="9" fill="#1f6feb"/>
  <circle cx="134" cy="179" r="9" fill="#3fb950"/>
  <rect x="158" y="173" width="30" height="12" rx="6" fill="#c9d6ee"/>
</svg>
