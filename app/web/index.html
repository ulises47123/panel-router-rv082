    <div class="estado-con"><i class="punto" id="punto"></i><span id="estadoTxt">Conectando…</span></div>

      <span style="flex:1"></span><button class="chico" id="btnRecargar" title="Volver a leer del router"><svg class="ico-btn" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Actualizar</button></div>

<div class="modal-fondo" id="modal"><div class="modal"><button class="chico cerrar" onclick="cerrarModal()">Cerrar<svg class="ico-btn der" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button><div id="modalCuerpo"></div></div></div>
